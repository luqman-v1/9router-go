name: Publish opkg feed

# The opkg feed for the OpenWrt packages. The .ipk files themselves are release
# assets (~18 MB each, and re-uploading them per release is not what Pages is
# for), so this workflow publishes only the small Packages index that points at
# them.
#
# It runs when a release is published, not on a push: the index describes one
# release's packages, and an index built from the working tree would name files
# that are not downloadable yet.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the feed for (e.g. v1.9.14)
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opkg-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$TAG" ] || { echo "::error::no tag to publish"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The index was generated by tools/ipkbuild during the release and uploaded
      # next to the packages, so this job never rebuilds or re-derives a size.
      # Downloading the published file is what keeps the index and the
      # downloadable .ipk files describing the same bytes: a second build here
      # could produce a different digest and turn every install into a checksum
      # failure.
      #
      # The architecture list is read from the release's own asset names, not
      # from a list written here. A hardcoded list drifts the moment the Makefile
      # gains an alias, and the drift is invisible: the feed simply has no
      # directory for that target.
      - name: Discover architectures and fetch their indexes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          arches=$(
            for a in $assets; do
              case "$a" in
                Packages.*)
                  arch=${a#Packages.}
                  case "$arch" in *.gz) ;; *) printf '%s\n' "$arch" ;; esac
                  ;;
              esac
            done | sort -u
          )
          if [ -z "$arches" ]; then
            echo "::error::release $TAG carries no Packages.<arch> asset."
            echo "The release job must run 'make ipk IPK_BASE_URL=...' and upload"
            echo "the generated Packages.<arch>(.gz) as release assets."
            exit 1
          fi
          for a in $arches; do printf '  arch: %s\n' "$a"; done
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for arch in $arches; do
            dir="feed/openwrt/$arch"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/Packages" "$base/Packages.$arch" || {
              echo "::error::Packages.$arch is listed but not downloadable"
              exit 1
            }
            if curl -fsSL -o "$dir/Packages.gz" "$base/Packages.$arch.gz"; then
              echo "got Packages.gz for $arch"
            else
              # opkg prefers the .gz and falls back to the plain file; a missing
              # .gz is survivable, a stale one is not, so it is simply absent.
              rm -f "$dir/Packages.gz"
            fi
          done

      # A feed that names a package whose download 404s is worse than no feed:
      # opkg reports a corrupt index and the operator debugs the wrong thing.
      - name: Verify each index targets this release and is well formed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(feed/openwrt/*/Packages)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no index was fetched"; exit 1; }
          for f in "${files[@]}"; do
            grep -q "Filename: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" "$f" || {
              echo "::error::$f does not point at release $TAG"
              exit 1
            }
            # SHA256sum is what opkg verifies after downloading; a truncated or
            # empty digest makes every install fail at the last step.
            awk -F': ' '$1 == "SHA256sum" && length($2) != 64 { exit 1 }' "$f" || {
              echo "::error::$f has a malformed SHA256sum"
              exit 1
            }
            pkg_count=$(grep -c '^Package: ' "$f")
            [ "$pkg_count" -ge 2 ] || {
              echo "::error::$f lists $pkg_count packages; expected 9router-go and luci-app-9router-go"
              exit 1
            }
            # The Architecture field has to match the directory, or opkg sees a
            # package it will never install for the device whose feed this is.
            arch=$(basename "$(dirname "$f")")
            awk -F': ' -v want="$arch" '
              $1 == "Package" { pkg = $2 }
              $1 == "Architecture" && pkg == "9router-go" && $2 != want { exit 1 }
            ' "$f" || {
              echo "::error::$f: 9router-go Architecture does not match directory $arch"
              exit 1
            }
            echo "ok: $f ($pkg_count packages)"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The feed lives under /openwrt/ on the same site as the landing page, so
      # the landing page is regenerated here rather than relying on the other
      # workflow having deployed last.
      - name: Regenerate the landing page alongside the feed
        run: |
          set -euo pipefail
          go run ./tools/sitegen -out _site
          cp -r feed/openwrt _site/openwrt
          find _site/openwrt -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
