name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build Web SPA
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      # The web suite ran nowhere before this: CI only built the SPA, so a PR
      # breaking client.ts or router.ts still went green. bun:test needs no
      # extra dependency — the runner already has bun and the install above.
      - name: Test web
        working-directory: web
        run: bun test

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Build
        run: go build -ldflags="-s -w" -o /tmp/9router-go ./cmd/9router-go/
