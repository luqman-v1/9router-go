name: Question
description: Ask how to configure, use, or troubleshoot 9router-go
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Support questions are welcome — this is not a bug report, so do not use the bug template for "how do I…".

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I have already tried
      description: Include commands you ran and what they printed.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.9.9
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Docker
        - Other
    validations:
      required: true